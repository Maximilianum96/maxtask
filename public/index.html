<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FashionGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <h1 class="logo">FashionGPT</h1>
        <p class="tagline">Your AI Style Companion</p>
      </div>
      <nav class="mode-tabs">
        <button class="mode-tab active" data-mode="style-advisor">
          <span class="tab-icon">&#9733;</span>
          Style Advisor
        </button>
        <button class="mode-tab" data-mode="outfit-generator">
          <span class="tab-icon">&#9827;</span>
          Outfit Generator
        </button>
        <button class="mode-tab" data-mode="wardrobe-assistant">
          <span class="tab-icon">&#9830;</span>
          Wardrobe Assistant
        </button>
      </nav>
    </header>

    <main class="chat-container" id="chatContainer">
      <div class="chat-messages" id="chatMessages"></div>
    </main>

    <footer class="input-bar">
      <form id="chatForm" class="chat-form">
        <input
          type="text"
          id="messageInput"
          class="message-input"
          placeholder="Ask me anything about fashion..."
          autocomplete="off"
        >
        <button type="submit" class="send-btn" id="sendBtn">
          <span class="send-arrow">&#8593;</span>
        </button>
      </form>
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
